name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt pytest

      - name: 单元测试
        run: python -m pytest -q

      - name: 端到端冒烟（mock 云盘，不联网）
        run: python tests/e2e_mock.py
